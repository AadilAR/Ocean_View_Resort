<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean View Resort | Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url('images/background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        z-index: -1;
    }

    .container {
        width: 380px;
        padding: 45px 40px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        color: white;
        animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    label {
        font-size: 14px;
        margin-bottom: 6px;
        display: block;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: none;
        background: rgba(255,255,255,0.2);
        color: white;
        font-size: 14px;
    }

    input::placeholder {
        color: rgba(255,255,255,0.7);
    }

    button {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        background: linear-gradient(135deg, #1e3c50, #2c5364);
        color: white;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .back {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
    }

    .back a {
        color: #ffffff;
        text-decoration: none;
        opacity: 0.8;
    }

    .back a:hover {
        opacity: 1;
        text-decoration: underline;
    }

    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
        display: none;
        font-size: 13px;
    }

    .error {
        background-color: rgba(255, 0, 0, 0.2);
        border: 1px solid rgba(255, 0, 0, 0.4);
    }

    .success {
        background-color: rgba(0, 255, 0, 0.2);
        border: 1px solid rgba(0, 255, 0, 0.4);
    }

    .help-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2c5364, #1e3c50);
        color: white;
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Forgot Password</h2>

  <div id="messageBox" class="message"></div>

  <form action="forgot-password" method="post">
    <label>Enter your registered email</label>
    <input type="email" name="email" placeholder="Email address" required>

    <button type="submit">Send Reset Link</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const success = params.get("success");
  const box = document.getElementById("messageBox");

  if (error) {
      box.className = "message error";

      if (error === "empty") {
          box.innerText = "Email is required.";
      } else if (error === "notfound") {
          box.innerText = "No account found with that email.";
      } else if (error === "server") {
          box.innerText = "Server error. Please try again.";
      }

      box.style.display = "block";
  }

  if (success === "sent") {
      box.className = "message success";
      box.innerText = "Reset link has been sent to your email.";
      box.style.display = "block";
  }
</script>

<a href="help" class="help-btn">?</a>

</body>
</html>
