<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean View Resort | Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 380px;
        background: #ffffff;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        text-align: center;
        animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
        margin-bottom: 25px;
        color: #2c5364;
    }

    label {
        display: block;
        text-align: left;
        font-weight: 600;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 11px;
        margin-bottom: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    input:focus {
        border-color: #2c5364;
        outline: none;
        box-shadow: 0 0 6px rgba(44,83,100,0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #2c5364;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }

    button:hover {
        background-color: #1e3c50;
    }

    .back {
        margin-top: 15px;
        font-size: 14px;
    }

    .back a {
        text-decoration: none;
        color: #2c5364;
    }

    .back a:hover {
        text-decoration: underline;
    }

    .message {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        display: none;
    }

    .error {
        background-color: #f8d7da;
        color: #842029;
    }

    .success {
        background-color: #d1e7dd;
        color: #0f5132;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <h2>Reset Password</h2>

  <div id="messageBox" class="message"></div>

  <form action="forgot-password" method="post">
    <label>Enter your username</label>
    <input type="text" name="username" required>

    <button type="submit">Recover Password</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const success = params.get("success");

  const box = document.getElementById("messageBox");

  if (error === "empty") {
      box.className = "message error";
      box.innerText = "Username is required.";
      box.style.display = "block";
  }

  if (error === "notfound") {
      box.className = "message error";
      box.innerText = "Username not found.";
      box.style.display = "block";
  }

  if (success === "recovered") {
      const password = params.get("password");
      box.className = "message success";
      box.innerText = "Your password is: " + password;
      box.style.display = "block";
  }
</script>

</body>
</html>
