<!DOCTYPE html>
<html>
<head>
  <title>Ocean View Resort | Reservation</title>

  <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f4f7fa;
    }

    .header {
        background-color: #2c5364;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        position: relative;
    }

    .logout {
        position: absolute;
        right: 20px;
        top: 25px;
        font-size: 14px;
    }

    .logout a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .logout a:hover {
        text-decoration: underline;
    }

    .container {
        width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #2c5364;
    }

    h3 {
        color: #2c5364;
        margin-top: 10px;
    }

    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
        font-size: 14px;
    }

    .error {
        background-color: #f8d7da;
        color: #842029;
    }

    .success {
        background-color: #d1e7dd;
        color: #0f5132;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 20px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    input:focus {
        border-color: #2c5364;
        outline: none;
        box-shadow: 0 0 6px rgba(44,83,100,0.3);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #2c5364;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #1e3c50;
    }

    .divider {
        margin: 30px 0;
        border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

<div class="header">
  Ocean View Resort Reservation System

  <div class="logout">
    <a href="logout">Logout</a>
  </div>
</div>

<div class="container">

  <h2>Book Your Stay</h2>

  <div id="messageBox" class="message"></div>

  <!-- ===================== -->
  <!-- SEARCH SECTION -->
  <!-- ===================== -->

  <h3>Search Reservation by Mobile</h3>

  <form method="get" action="reserve">
    <input type="text" name="search"
           placeholder="Enter mobile number" required>
    <button type="submit">Search</button>
  </form>

  <div class="divider"></div>

  <!-- ===================== -->
  <!-- BOOKING FORM -->
  <!-- ===================== -->

  <form method="post" action="reserve">

    <label>Guest Name</label>
    <input type="text" name="guestName" required>

    <label>Address</label>
    <input type="text" name="address">

    <label>Contact Number</label>
    <input type="text" name="contactNumber" required>

    <label>Room ID</label>
    <input type="number" name="roomId" required>

    <label>Check-in Date</label>
    <input type="date" name="checkIn" required>

    <label>Check-out Date</label>
    <input type="date" name="checkOut" required>

    <button type="submit">Reserve Room</button>

  </form>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const success = params.get("success");

  const box = document.getElementById("messageBox");

  if (error === "unavailable") {
      box.className = "message error";
      box.innerText = "Room is already booked for the selected dates.";
      box.style.display = "block";
  }

  if (error === "invalidDate") {
      box.className = "message error";
      box.innerText = "Invalid check-in and check-out dates.";
      box.style.display = "block";
  }

  if (success === "booked") {
      box.className = "message success";
      box.innerText = "Reservation successful!";
      box.style.display = "block";
  }
</script>

</body>
</html>
