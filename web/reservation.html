<!DOCTYPE html>
<html>
<head>
  <title>Ocean View Resort | Reservation</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-image: url('images/background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        position: relative;
    }

    /* Dark overlay */
    body::before {
        content: "";
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(4px);
        z-index: 0;
    }

    /* ================= HEADER ================= */

    .header {
        position: relative;
        z-index: 1;
        background: rgba(44,83,100,0.85);
        backdrop-filter: blur(8px);
        padding: 25px;
        text-align: center;
    }

    .brand-title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ffffff, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        display: block;
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 4px;
        margin-top: 6px;
        color: rgba(255,255,255,0.85);
    }

    .logout {
        position: absolute;
        right: 20px;
        top: 25px;
        font-size: 14px;
    }

    .logout a {
        color: white;
        text-decoration: none;
        font-weight: 500;
    }

    .logout a:hover {
        text-decoration: underline;
    }

    /* ================= LAYOUT ================= */

    .wrapper {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 50px;
        align-items: flex-start;
    }

    .container,
    .room-table {
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.25);
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        color: white;
    }

    .container { width: 500px; }
    .room-table { width: 450px; }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #ffffff;
        font-weight: 600;
    }

    button {
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        border: none;
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 14px;
        font-weight: 600;
        background: linear-gradient(135deg, #2c5364, #203a43);
        color: white;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .divider {
        margin: 30px 0;
        border-top: 1px solid rgba(255,255,255,0.3);
    }

    /* ================= REPORT DROPDOWN ================= */

    .dropdown {
        position: relative;
        width: 100%;
        margin-top: 10px;
    }

    .dropbtn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
        background: linear-gradient(135deg, #1e3c50, #2c5364);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: 0.3s ease;
    }

    .dropbtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .arrow {
        font-size: 12px;
        transition: transform 0.3s ease;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        width: 100%;
        background: rgba(255,255,255,0.98);
        border-radius: 12px;
        margin-top: 8px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        z-index: 10;
    }

    .dropdown-content a {
        display: block;
        padding: 14px;
        text-decoration: none;
        color: #1e3c50;
        font-weight: 600;
        transition: 0.3s ease;
    }

    .dropdown-content a:hover {
        background: #2c5364;
        color: white;
    }

    .show {
        display: block;
    }

    /* ================= ROOM TABLE ================= */

    .room-table table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    .room-table th,
    .room-table td {
        border: 1px solid rgba(255,255,255,0.3);
        padding: 12px;
        text-align: center;
    }

    .room-table th {
        background: rgba(44,83,100,0.9);
        color: white;
    }

    .room-table td {
        background: rgba(255,255,255,0.08);
    }

    /* ================= HELP BUTTON ================= */

    .help-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 55px;
        height: 55px;
        background: linear-gradient(135deg, #2c5364, #1e3c50);
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        line-height: 55px;
        border-radius: 50%;
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        transition: 0.3s ease;
        z-index: 999;
    }

    .help-btn:hover {
        transform: scale(1.1);
    }

  </style>
</head>

<body>

<div class="header">
  <span class="brand-title">Ocean View Resort</span>
  <div class="subtitle">RESERVATION SYSTEM</div>
  <div class="logout">
    <a href="logout">Logout</a>
  </div>
</div>

<div class="wrapper">

  <!-- LEFT SIDE -->
  <div class="container">

    <h2>Reservation Dashboard</h2>

    <a href="reserve"><button>Reservation System</button></a>
    <a href="reserve?viewAll=true"><button>View All Reservations</button></a>
    <a href="reserve?viewRooms=true"><button>View All Rooms</button></a>

    <div class="divider"></div>

    <h2>Management Reports</h2>

    <div class="dropdown">
      <button class="dropbtn" onclick="toggleDropdown(event)">
        Reports <span class="arrow" id="arrow">&#9662;</span>
      </button>

      <div class="dropdown-content" id="reportDropdown">
        <a href="reports?type=revenue">Revenue Report</a>
        <a href="reports?type=occupancy">Monthly Occupancy</a>
        <a href="reports?type=popular">Most Booked Room</a>
      </div>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="room-table">
    <h2>Room Types</h2>
    <table>
      <tr>
        <th>Room Type</th>
        <th>Starting Price</th>
      </tr>
      <tr><td>Standard</td><td>5000</td></tr>
      <tr><td>Deluxe</td><td>7000</td></tr>
      <tr><td>Suite</td><td>10000</td></tr>
    </table>
  </div>

</div>

<a href="help" class="help-btn">?</a>

<!-- ================= JAVASCRIPT ================= -->

<script>
  function toggleDropdown(event) {
      event.stopPropagation();
      const dropdown = document.getElementById("reportDropdown");
      const arrow = document.getElementById("arrow");

      dropdown.classList.toggle("show");

      if (dropdown.classList.contains("show")) {
          arrow.style.transform = "rotate(180deg)";
      } else {
          arrow.style.transform = "rotate(0deg)";
      }
  }

  // Close when clicking outside
  window.addEventListener("click", function() {
      const dropdown = document.getElementById("reportDropdown");
      const arrow = document.getElementById("arrow");

      if (dropdown.classList.contains("show")) {
          dropdown.classList.remove("show");
          arrow.style.transform = "rotate(0deg)";
      }
  });
</script>

</body>
</html>
