<!DOCTYPE html>
<html>
<head>
  <title>Ocean View Resort | Reservation</title>

  <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f4f7fa;
    }

    .header {
        background-color: #2c5364;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        position: relative;
    }

    .logout {
        position: absolute;
        right: 20px;
        top: 25px;
        font-size: 14px;
    }

    .logout a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .logout a:hover {
        text-decoration: underline;
    }

    .wrapper {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 40px;
        align-items: flex-start;
    }

    .container {
        width: 500px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .room-table {
        width: 450px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #2c5364;
    }

    h3 {
        color: #2c5364;
        margin-top: 10px;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #2c5364;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 12px;
    }

    button:hover {
        background-color: #1e3c50;
    }

    .divider {
        margin: 30px 0;
        border-top: 1px solid #ddd;
    }

    .room-table table {
        width: 100%;
        border-collapse: collapse;
    }

    .room-table th, .room-table td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
    }

    .room-table th {
        background-color: #2c5364;
        color: white;
    }

  </style>
</head>
<body>

<div class="header">
  Ocean View Resort Reservation System

  <div class="logout">
    <a href="logout">Logout</a>
  </div>
</div>

<div class="wrapper">

  <!-- LEFT SIDE -->
  <div class="container">

    <h2>Reservation Dashboard</h2>

    <!-- 🔥 MAIN BUTTON -->
    <a href="reserve">
      <button>Reservation System</button>
    </a>

    <a href="reserve?viewAll=true">
      <button>View All Reservations</button>
    </a>

    <a href="reserve?viewRooms=true">
      <button>View All Rooms </button>
    </a>

    <div class="divider"></div>

    <p>
      Use the buttons above to access the full dynamic reservation system
      with real-time room availability and booking management.
    </p>

  </div>

  <!-- RIGHT SIDE STATIC ROOM INFO (Optional Preview) -->
  <div class="room-table">

    <h2>Room Types</h2>

    <table>
      <tr>
        <th>Room Type</th>
        <th>Starting Price</th>
      </tr>

      <tr>
        <td>Standard</td>
        <td>5000</td>
      </tr>

      <tr>
        <td>Deluxe</td>
        <td>7000</td>
      </tr>

      <tr>
        <td>Suite</td>
        <td>10000</td>
      </tr>

    </table>

  </div>

</div>

</body>
</html>
