<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean View Resort | Staff Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 420px;
        background: #ffffff;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #2c5364;
        font-weight: 600;
    }

    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
        font-size: 14px;
        display: none;
        text-align: center;
    }

    .error {
        background-color: #f8d7da;
        color: #842029;
    }

    .success {
        background-color: #d1e7dd;
        color: #0f5132;
    }

    label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 11px;
        margin-bottom: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #2c5364;
        outline: none;
        box-shadow: 0 0 6px rgba(44,83,100,0.4);
    }

    .password-wrapper {
        position: relative;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        top: 35%;
        cursor: pointer;
        font-size: 13px;
        color: #2c5364;
    }

    button {
        width: 100%;
        padding: 13px;
        background-color: #2c5364;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: 600;
    }

    button:hover {
        background-color: #1e3c50;
    }

    .back {
        text-align: center;
        margin-top: 18px;
    }

    .back a {
        text-decoration: none;
        color: #2c5364;
        font-size: 14px;
        font-weight: 500;
    }

    .back a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Staff Registration</h2>

  <div id="messageBox" class="message"></div>

  <form method="post" action="signup" onsubmit="return validateForm()">

    <label>Username</label>
    <input type="text" name="username" id="username"
           required minlength="3"
           placeholder="Enter username">

    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" name="password" id="password"
             required minlength="6"
             placeholder="Minimum 6 characters">
      <span class="toggle-password"
            onclick="togglePassword('password')">Show</span>
    </div>

    <label>Confirm Password</label>
    <div class="password-wrapper">
      <input type="password" name="confirmPassword"
             id="confirmPassword" required
             placeholder="Re-enter password">
      <span class="toggle-password"
            onclick="togglePassword('confirmPassword')">Show</span>
    </div>

    <label>Role</label>
    <select name="role" required>
      <option value="">Select Role</option>
      <option value="STAFF">Staff</option>
      <option value="ADMIN">Admin</option>
    </select>

    <button type="submit">Create Account</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script>

  function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
          showMessage("Passwords do not match!", "error");
          return false;
      }

      if (password.length < 6) {
          showMessage("Password must be at least 6 characters!", "error");
          return false;
      }

      return true;
  }

  function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === "password" ? "text" : "password";
  }

  function showMessage(message, type) {
      const box = document.getElementById("messageBox");
      box.className = "message " + type;
      box.innerText = message;
      box.style.display = "block";
  }

  // Handle server messages
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const success = params.get("success");

  // Error handling
  if (error === "exists") {
      showMessage("Username already exists!", "error");
  } else if (error === "empty") {
      showMessage("Please fill all fields!", "error");
  } else if (error === "invalidRole") {
      showMessage("Invalid role selected!", "error");
  } else if (error === "server") {
      showMessage("Server error. Please try again.", "error");
  } else if (error === "passwordMismatch") {
      showMessage("Passwords do not match!", "error");
  } else if (error === "weakPassword") {
      showMessage("Password must be at least 6 characters!", "error");
  }

  // Success handling
  if (success === "registered") {
      showMessage("Account created successfully!", "success");
  }

</script>

</body>
</html>
