<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean View Resort | Staff Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 400px;
        background: #ffffff;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        animation: fadeIn 0.5s ease-in-out;
        position: relative;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #2c5364;
    }

    .message {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
        display: none;
    }

    .error {
        background-color: #f8d7da;
        color: #842029;
    }

    .success {
        background-color: #d1e7dd;
        color: #0f5132;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #2c5364;
        outline: none;
        box-shadow: 0 0 5px rgba(44,83,100,0.5);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #2c5364;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1e3c50;
    }

    .back {
        text-align: center;
        margin-top: 15px;
    }

    .back a {
        text-decoration: none;
        color: #2c5364;
        font-size: 14px;
    }

    .back a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Staff Registration</h2>

  <div id="messageBox" class="message"></div>

  <form method="post" action="signup" onsubmit="return validateForm()">

    <label>Username</label>
    <input type="text" name="username" id="username" required minlength="3">

    <label>Password</label>
    <input type="password" name="password" id="password" required minlength="6">

    <label>Confirm Password</label>
    <input type="password" name="confirmPassword" id="confirmPassword" required>

    <label>Role</label>
    <select name="role" required>
      <option value="">Select Role</option>
      <option value="STAFF">Staff</option>
      <option value="ADMIN">Admin</option>
    </select>

    <button type="submit">Create Account</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script>
  function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
          showMessage("Passwords do not match!", "error");
          return false;
      }

      return true;
  }

  function showMessage(message, type) {
      const box = document.getElementById("messageBox");
      box.className = "message " + type;
      box.innerText = message;
      box.style.display = "block";
  }

  // Show server messages from URL parameters
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");

  if (error === "exists") {
      showMessage("Username already exists!", "error");
  } else if (error === "empty") {
      showMessage("Please fill all fields!", "error");
  } else if (error === "invalidRole") {
      showMessage("Invalid role selected!", "error");
  } else if (error === "server") {
      showMessage("Server error. Please try again.", "error");
  }
</script>

</body>
</html>
