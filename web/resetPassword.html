<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean View Resort | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url('images/background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        z-index: -1;
    }

    .container {
        width: 380px;
        padding: 45px 40px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        color: white;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
    }

    label {
        font-size: 14px;
        margin-bottom: 6px;
        display: block;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: none;
        background: rgba(255,255,255,0.2);
        color: white;
    }

    button {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        background: linear-gradient(135deg, #1e3c50, #2c5364);
        color: white;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .back {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
    }

    .back a {
        color: #ffffff;
        text-decoration: none;
    }

    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
        display: none;
        font-size: 13px;
    }

    .error {
        background-color: rgba(255, 0, 0, 0.2);
        border: 1px solid rgba(255, 0, 0, 0.4);
    }

    .success {
        background-color: rgba(0, 255, 0, 0.2);
        border: 1px solid rgba(0, 255, 0, 0.4);
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Create New Password</h2>

  <div id="messageBox" class="message"></div>

  <form id="resetForm" action="reset-password" method="post">

    <!-- Hidden token -->
    <input type="hidden" name="token" id="tokenField">

    <label>New Password</label>
    <input type="password" name="password" placeholder="New password" required minlength="6">

    <label>Confirm Password</label>
    <input type="password" name="confirmPassword" placeholder="Confirm password" required minlength="6">

    <button type="submit">Update Password</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script>
  const params  = new URLSearchParams(window.location.search);
  const error   = params.get("error");
  const success = params.get("success");
  const token   = params.get("token");

  const box     = document.getElementById("messageBox");
  const form    = document.getElementById("resetForm");
  const tokenField = document.getElementById("tokenField");

  // If no token in URL → block form
  if (!token) {
      box.className = "message error";
      box.innerText = "Invalid or missing reset token.";
      box.style.display = "block";
      form.style.display = "none";
  } else {
      tokenField.value = token;
  }

  if (error === "empty") {
      box.className = "message error";
      box.innerText = "All fields are required.";
      box.style.display = "block";
  }

  if (error === "passwordMismatch") {
      box.className = "message error";
      box.innerText = "Passwords do not match.";
      box.style.display = "block";
  }

  if (error === "weakPassword") {
      box.className = "message error";
      box.innerText = "Password must be at least 6 characters.";
      box.style.display = "block";
  }

  if (error === "invalidToken") {
      box.className = "message error";
      box.innerText = "Invalid or expired reset link.";
      box.style.display = "block";
      form.style.display = "none";
  }

  if (success === "reset") {
      box.className = "message success";
      box.innerText = "Password updated successfully. You may now log in.";
      box.style.display = "block";
      form.style.display = "none";
  }
</script>

</body>
</html>
