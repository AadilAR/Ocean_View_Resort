<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean View Resort | Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: #2c5364;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2c5364;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1e3c50;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #ddd;
        }

        .signup-text {
            font-size: 14px;
            margin-bottom: 10px;
            color: #555;
        }

        .signup-btn {
            width: 100%;
            padding: 10px;
            background-color: #f4f7fa;
            color: #2c5364;
            border: 1px solid #2c5364;
            border-radius: 6px;
            cursor: pointer;
        }

        .signup-btn:hover {
            background-color: #e6eef2;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Ocean View Resort</h2>

    <form method="post" action="login">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="divider"></div>

    <div class="signup-text">
        Don't have an account?
    </div>

    <form action="signup.html" method="get">
        <button type="submit" class="signup-btn">
            Create Staff Account
        </button>
    </form>

    <div class="footer">
        © 2026 Ocean View Resort
    </div>

</div>

</body>
</html>
