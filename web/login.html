<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean View Resort | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background Image */
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;

            width: 400px;
            padding: 45px;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);

            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }

        .error {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ffdddd;
        }

        .success {
            background-color: rgba(0, 255, 0, 0.2);
            color: #ddffdd;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: 500;
            color: #ffffff;
        }

        input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    outline: none;
    font-size: 14px;

    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);

    color: #ffffff;
    transition: all 0.3s ease;
}

input::placeholder {
    color: rgba(255,255,255,0.7);
}

        input:focus {
    border: 1px solid rgba(212,175,55,0.8);
    box-shadow:
        0 0 8px rgba(212,175,55,0.6),
        0 0 18px rgba(212,175,55,0.4);
    background: rgba(255,255,255,0.35);
}

        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(90deg, #2c5364, #203a43);
            color: white;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .forgot-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .forgot-link a {
            color: #ffffff;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        .signup-text {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .signup-btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: white;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #ffffff;
        }

        /* Help Button */
        .help-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #2c5364, #1e3c50);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            line-height: 55px;
            border-radius: 50%;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            transition: 0.3s ease;
            z-index: 999;
        }

        .help-btn:hover {
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

<div class="login-container">

    <h1 class="brand-title">Ocean View Resort</h1>

    <div id="messageBox" class="message"></div>

    <form method="post" action="login">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="forgot-link">
        <a href="forgotPassword.html">Forgot Password?</a>
    </div>

    <div class="divider"></div>

    <div class="signup-text">
        Don't have an account?
    </div>

    <form action="signup.html" method="get">
        <button type="submit" class="signup-btn">
            Create Staff Account
        </button>
    </form>

    <div class="footer">
        © 2026 Ocean View Resort
    </div>

</div>

<a href="help" class="help-btn">?</a>

<script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const success = params.get("success");

    const box = document.getElementById("messageBox");

    if (error === "invalid") {
        box.className = "message error";
        box.innerText = "Invalid username or password.";
        box.style.display = "block";
    } else if (error === "empty") {
        box.className = "message error";
        box.innerText = "Username and password are required.";
        box.style.display = "block";
    }

    if (success === "registered") {
        box.className = "message success";
        box.innerText = "Account created successfully. Please login.";
        box.style.display = "block";
    }
</script>

</body>
</html>
